services:
  api:
    build: .
    container_name: express_starter_api
    restart: unless-stopped
    ports:
      - "5000:5000"
    env_file:
      - .env
    volumes:
      - .:/usr/src/app
      - /usr/src/app/node_modules
      - /usr/src/app/node_modules/.prisma
    environment:
      - NODE_ENV=development
